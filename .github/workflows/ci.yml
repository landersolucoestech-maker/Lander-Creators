name: CI

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lander_creators_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lander_creators_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lander_creators_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lander_creators_test
      AUTH_SECRET: ci-only-placeholder-secret-0123456789abcdef
      AUTH_BASE_URL: http://127.0.0.1:3000
      EMAIL_DELIVERY_MODE: safe-log
      LOG_LEVEL: info
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Deterministic install
        run: npm ci --no-audit --no-fund
      - name: Migrate clean PostgreSQL
        run: npm run db:migrate
      - name: Verify migration repeatability
        run: npm run db:migrate
      - name: Bootstrap reference foundation
        run: npm run foundation:bootstrap
      - name: Verify bootstrap idempotency
        run: npm run foundation:bootstrap
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Engineering OS contracts
        run: npm run test:engineering-os
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Runtime smoke
        run: |
          NODE_ENV=production npm start > /tmp/lander-creators.log 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/api/health > /tmp/health.json; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/lander-creators.log
            exit 1
          fi
          grep -q '"status":"ok"' /tmp/health.json
          curl --fail --silent http://127.0.0.1:3000/ > /tmp/root.html

  visual_inspection:
    needs: validate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lander_creators_visual
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lander_creators_visual"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lander_creators_visual
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lander_creators_visual
      AUTH_SECRET: ci-only-visual-secret-0123456789abcdef
      AUTH_BASE_URL: http://127.0.0.1:3000
      EMAIL_DELIVERY_MODE: safe-log
      MEDIA_STORAGE_MODE: ephemeral
      LOG_LEVEL: info
    steps:
      - name: Checkout exact validated SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Deterministic application install
        run: npm ci --no-audit --no-fund
      - name: Install repository-local visual tooling
        run: npm install --no-save --no-package-lock @playwright/test@1.55.0 @axe-core/playwright@4.10.2
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Migrate visual PostgreSQL
        run: npm run db:migrate
      - name: Bootstrap visual reference foundation
        run: npm run foundation:bootstrap
      - name: Build exact SHA
        run: npm run build
      - name: Start application
        run: |
          NODE_ENV=production npm start > /tmp/lander-creators-visual.log 2>&1 &
          echo $! > /tmp/lander-creators-visual.pid
          ready=0
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/api/health > /tmp/health.json; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/lander-creators-visual.log
            exit 1
          fi
          grep -q '"status":"ok"' /tmp/health.json
          curl --fail --silent http://127.0.0.1:3000/ > /tmp/root.html
      - name: Capture navigable preview
        run: |
          rm -rf preview-site
          mkdir -p preview-site
          wget --quiet --mirror --convert-links --adjust-extension --page-requisites --no-parent \
            --directory-prefix=preview-site http://127.0.0.1:3000/
          if [ -d preview-site/127.0.0.1:3000 ]; then
            cp -R preview-site/127.0.0.1:3000/. preview-site/
            rm -rf preview-site/127.0.0.1:3000
          fi
          test -f preview-site/index.html
      - name: Browser visual inspection
        run: |
          if ! npx playwright test --config=playwright.visual.config.mjs; then
            echo "Visual inspection failed; application diagnostics follow."
            cat /tmp/lander-creators-visual.log
            exit 1
          fi
      - name: Generate visual report
        if: always()
        run: node scripts/generate-visual-report.mjs
      - name: Upload visual inspection artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lander-creators-visual-inspection
          path: |
            visual/
            visual-report/
            preview-site/
            test-results/
          if-no-files-found: error
          retention-days: 14
      - name: Stop application
        if: always()
        run: |
          if [ -f /tmp/lander-creators-visual.pid ]; then
            kill "$(cat /tmp/lander-creators-visual.pid)" 2>/dev/null || true
          fi

  publish_visual:
    needs: [validate, visual_inspection]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Download visual artifact
        uses: actions/download-artifact@v4
        with:
          name: lander-creators-visual-inspection
          path: public-visual
      - name: Validate visual artifact
        run: |
          test -f public-visual/preview-site/index.html
          test -d public-visual/visual
          test -d public-visual/visual-report
