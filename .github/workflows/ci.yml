name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Commit generated lockfile
        run: |
          if git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: commit deterministic npm lockfile"
          git push origin HEAD:main
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build
        env:
          NODE_ENV: production
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lander_creators
          AUTH_SECRET: ci-only-placeholder-secret-0123456789abcdef
          LOG_LEVEL: info
        run: npm run build
      - name: Runtime smoke
        env:
          NODE_ENV: production
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lander_creators
          AUTH_SECRET: ci-only-placeholder-secret-0123456789abcdef
          LOG_LEVEL: info
        run: |
          npm start > /tmp/lander-creators.log 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/api/health > /tmp/health.json; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/lander-creators.log
            exit 1
          fi
          grep -q '"status":"ok"' /tmp/health.json
          curl --fail --silent http://127.0.0.1:3000/ > /tmp/root.html
          grep -q 'Plataforma em configuração inicial.' /tmp/root.html
