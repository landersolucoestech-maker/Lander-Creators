name: Live Preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lander-creators-live-preview
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lander_creators_preview
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lander_creators_preview"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lander_creators_preview
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lander_creators_preview
      EMAIL_DELIVERY_MODE: safe-log
      MEDIA_STORAGE_MODE: ephemeral
      LOG_LEVEL: info
      LANDER_PREVIEW_RUNTIME: "true"
      LANDER_LIVE_PREVIEW: "true"
      LIVE_PREVIEW_EMAIL: ${{ secrets.LIVE_PREVIEW_EMAIL }}
      LIVE_PREVIEW_PASSWORD: ${{ secrets.LIVE_PREVIEW_PASSWORD }}
      AUTH_SECRET: live-preview-build-only-secret-0123456789abcdef
      AUTH_BASE_URL: http://127.0.0.1:3000
    steps:
      - name: Checkout exact main SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Verify exact SHA
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          echo "LIVE_PREVIEW_SHA=${{ github.sha }}" >> "$GITHUB_ENV"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Validate owner preview credentials
        shell: bash
        run: |
          if [ -z "${LIVE_PREVIEW_EMAIL:-}" ] || [ -z "${LIVE_PREVIEW_PASSWORD:-}" ]; then
            echo "::error::LIVE_PREVIEW_CREDENTIALS_NOT_CONFIGURED — required repository secrets: LIVE_PREVIEW_EMAIL and LIVE_PREVIEW_PASSWORD"
            exit 1
          fi
          if [ "${#LIVE_PREVIEW_PASSWORD}" -lt 10 ]; then
            echo "::error::LIVE_PREVIEW_PASSWORD does not satisfy the application minimum password length"
            exit 1
          fi

      - name: Deterministic install
        run: npm ci --no-audit --no-fund

      - name: Migrate preview PostgreSQL
        run: npm run db:migrate

      - name: Bootstrap reference foundation
        run: npm run foundation:bootstrap

      - name: Build exact SHA
        run: npm run build

      - name: Bootstrap authenticated preview owner
        shell: bash
        run: |
          echo "::error::PREVIEW_BOOTSTRAP_IMPLEMENTATION_PENDING"
          exit 1

      - name: Generate ephemeral runtime secret
        shell: bash
        run: |
          AUTH_SECRET="$(openssl rand -hex 32)"
          echo "::add-mask::$AUTH_SECRET"
          echo "AUTH_SECRET=$AUTH_SECRET" >> "$GITHUB_ENV"

      - name: Open temporary public URL first
        shell: bash
        run: |
          npx --yes localtunnel --port 3000 > /tmp/tunnel.log 2>&1 &
          echo $! > /tmp/tunnel.pid
          for i in {1..90}; do
            URL="$(grep -oE 'https://[^ ]+\.loca\.lt' /tmp/tunnel.log | head -1 || true)"
            if [ -n "$URL" ]; then
              echo "LIVE_PREVIEW_URL=$URL" >> "$GITHUB_ENV"
              echo "AUTH_BASE_URL=$URL" >> "$GITHUB_ENV"
              exit 0
            fi
            sleep 1
          done
          cat /tmp/tunnel.log
          exit 1

      - name: Start LANDER CREATORS with external auth origin
        shell: bash
        run: |
          test -n "$LIVE_PREVIEW_URL"
          test "$AUTH_BASE_URL" = "$LIVE_PREVIEW_URL"
          case "$AUTH_BASE_URL" in
            http://127.0.0.1*|http://localhost*|https://127.0.0.1*|https://localhost*)
              echo "Refusing to start external preview with localhost AUTH_BASE_URL"
              exit 1
              ;;
          esac
          NODE_ENV=production AUTH_BASE_URL="$LIVE_PREVIEW_URL" npm start > /tmp/app.log 2>&1 &
          echo $! > /tmp/app.pid
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:3000/api/health > /tmp/local-health.json; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/app.log
          exit 1

      - name: External-origin smoke
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 12 --retry-all-errors --retry-delay 2 -fsS "$LIVE_PREVIEW_URL/api/health" > /tmp/external-health.json
          grep -q '"status":"ok"' /tmp/external-health.json
          curl --retry 12 --retry-all-errors --retry-delay 2 -fsSL "$LIVE_PREVIEW_URL/" > /tmp/external-root.html
          test -s /tmp/external-root.html

      - name: Publish live application summary immediately
        shell: bash
        run: |
          STARTED_AT="$(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          EXPIRES_AT="$(date -u -d '+340 minutes' '+%Y-%m-%d %H:%M:%S UTC')"
          {
            echo "# LANDER CREATORS — LIVE APPLICATION"
            echo
            echo "**Public URL:** $LIVE_PREVIEW_URL"
            echo
            echo "- Exact SHA: `$LIVE_PREVIEW_SHA`"
            echo "- Run ID: `${{ github.run_id }}`"
            echo "- Status: **LIVE — external health and root smoke passed**"
            echo "- Started: $STARTED_AT"
            echo "- Expected expiry: $EXPIRES_AT"
            echo "- Runtime: real Next.js + ephemeral PostgreSQL on this GitHub Actions runner"
            echo "- Auth origin: public preview origin (not localhost)"
            echo "- Media: ephemeral preview storage"
            echo
            echo "## Owner access"
            echo
            echo "Login email: use the configured LIVE_PREVIEW_EMAIL GitHub Actions secret value"
            echo "Password: use the configured LIVE_PREVIEW_PASSWORD GitHub Actions secret value"
            echo
            echo "## LIVE APPLICATION vs VISUAL REPORT"
            echo
            echo "This URL is the **LIVE APPLICATION**. GitHub Pages from CI is only the **VISUAL REPORT**."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Authenticated acceptance gate
        shell: bash
        run: |
          set -euo pipefail
          COOKIE_JAR=/tmp/preview-cookies.txt
          BODY=/tmp/signin.json
          HTTP_CODE="$(curl -sS -o "$BODY" -w '%{http_code}' -c "$COOKIE_JAR" -H 'content-type: application/json' -X POST "$LIVE_PREVIEW_URL/api/auth/sign-in/email" --data-binary @- <<'JSON'
          {"email":"__EMAIL__","password":"__PASSWORD__"}
          JSON
          )"
          # Do not put credentials in command text/logs: replace placeholders in-memory via node and retry.
          rm -f "$BODY" "$COOKIE_JAR"
          node - <<'NODE' > /tmp/signin-payload.json
          process.stdout.write(JSON.stringify({email:process.env.LIVE_PREVIEW_EMAIL,password:process.env.LIVE_PREVIEW_PASSWORD}))
          NODE
          HTTP_CODE="$(curl -sS -o /tmp/signin-response.json -w '%{http_code}' -c "$COOKIE_JAR" -H 'content-type: application/json' -X POST "$LIVE_PREVIEW_URL/api/auth/sign-in/email" --data-binary @/tmp/signin-payload.json)"
          rm -f /tmp/signin-payload.json
          test "$HTTP_CODE" -ge 200 -a "$HTTP_CODE" -lt 300
          curl -fsS -b "$COOKIE_JAR" "$LIVE_PREVIEW_URL/api/auth/get-session" > /tmp/session.json
          node -e 'const fs=require("fs");const x=JSON.parse(fs.readFileSync("/tmp/session.json","utf8"));if(!x?.user?.email)process.exit(1)'
          curl -fsSL -b "$COOKIE_JAR" "$LIVE_PREVIEW_URL/" > /tmp/authenticated-root.html
          grep -q "LANDER CREATORS" /tmp/authenticated-root.html
          curl -fsSL -b "$COOKIE_JAR" "$LIVE_PREVIEW_URL/campaigns" > /tmp/authenticated-campaigns.html
          test -s /tmp/authenticated-campaigns.html
          rm -f "$COOKIE_JAR" /tmp/signin-response.json /tmp/session.json

      - name: Failure diagnostics
        if: failure()
        shell: bash
        run: |
          echo "Exact SHA: ${{ github.sha }}"
          echo "Public URL: ${LIVE_PREVIEW_URL:-not-created}"
          echo "--- local health ---"
          cat /tmp/local-health.json 2>/dev/null || true
          echo "--- external health ---"
          cat /tmp/external-health.json 2>/dev/null || true
          echo "--- application log tail ---"
          tail -n 120 /tmp/app.log 2>/dev/null || true
          echo "--- tunnel log tail ---"
          tail -n 120 /tmp/tunnel.log 2>/dev/null || true

      - name: Keep preview online
        if: always()
        shell: bash
        run: |
          if [ -n "${LIVE_PREVIEW_URL:-}" ]; then
            echo "LANDER CREATORS LIVE APPLICATION: $LIVE_PREVIEW_URL"
            sleep 20400
          else
            echo "No public preview URL was created; nothing to keep alive."
          fi
