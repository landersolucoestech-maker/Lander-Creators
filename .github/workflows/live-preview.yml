name: Live Preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lander-creators-live-preview
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lander_creators_preview
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lander_creators_preview"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lander_creators_preview
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lander_creators_preview
      AUTH_SECRET: preview-only-secret-0123456789abcdef
      AUTH_BASE_URL: http://127.0.0.1:3000
      EMAIL_DELIVERY_MODE: safe-log
      MEDIA_STORAGE_MODE: ephemeral
      LOG_LEVEL: info
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run db:migrate
      - run: npm run foundation:bootstrap
      - run: npm run build
      - name: Start LANDER CREATORS
        run: |
          npm start > /tmp/app.log 2>&1 &
          for i in {1..60}; do
            curl -fsS http://127.0.0.1:3000/api/health && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:3000/api/health
      - name: Open temporary public URL
        run: |
          npx --yes localtunnel --port 3000 > /tmp/tunnel.log 2>&1 &
          for i in {1..60}; do
            URL=$(grep -oE 'https://[^ ]+\.loca\.lt' /tmp/tunnel.log | head -1 || true)
            if [ -n "$URL" ]; then
              echo "LIVE_PREVIEW_URL=$URL" >> "$GITHUB_ENV"
              echo "### LANDER CREATORS LIVE PREVIEW" >> "$GITHUB_STEP_SUMMARY"
              echo "$URL" >> "$GITHUB_STEP_SUMMARY"
              echo "LIVE_PREVIEW_URL=$URL"
              exit 0
            fi
            sleep 1
          done
          cat /tmp/tunnel.log
          exit 1
      - name: Keep preview online
        run: |
          echo "LANDER CREATORS: $LIVE_PREVIEW_URL"
          sleep 20400
